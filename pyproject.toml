[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bladerf-mesh-baseline"
version = "0.1.0"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
